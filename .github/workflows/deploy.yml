name: Auto Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:  # يسمح بتشغيل يدوي من GitHub

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "🚀 Starting auto-deploy..."
            
            cd /root/alfa-expert-option || {
              echo "📥 First time - cloning repo..."
              git clone https://ali452158:${{ secrets.GITHUB_TOKEN }}@github.com/ali452158/alfa-expert-option.git /root/alfa-expert-option
              cd /root/alfa-expert-option
            }
            
            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🔨 Building application..."
            npm run build
            
            echo "🔄 Restarting application..."
            pm2 delete alfa-expert 2>/dev/null || true
            pm2 start npm --name alfa-expert -- start
            pm2 save
            
            echo "✅ Deploy complete!"
            pm2 status
